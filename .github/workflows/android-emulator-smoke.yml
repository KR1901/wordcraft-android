name: Android Emulator Startup Smoke Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-emulator-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  emulator-smoke:
    name: Launch app on Android emulator
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
      - name: Run Android instrumentation smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: default
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot
          emulator-boot-timeout: 900
          disable-animations: true
          script: |
            set -Eeuo pipefail
            capture_logs() {
              status=$?
              if [ "$status" -ne 0 ]; then
                echo "::group::Android emulator and app logs"
                adb devices -l || true
                adb logcat -d -v time -t 8000 | grep -E -C 6 'FATAL EXCEPTION|AndroidRuntime|com\\.wordcraft\\.android|Process: |Fatal signal|UnsatisfiedLinkError|NoClassDefFoundError' || true
                echo "::endgroup::"
              fi
              exit "$status"
            }
            trap capture_logs EXIT
            chmod +x ./gradlew
            ./gradlew --no-daemon --stacktrace connectedDebugAndroidTest
      - name: Capture host-visible emulator logs on failure
        if: failure()
        shell: bash
        run: |
          adb devices -l || true
          adb logcat -d -v time -t 8000 | grep -E -C 6 'FATAL EXCEPTION|AndroidRuntime|com\\.wordcraft\\.android|Process: |Fatal signal|UnsatisfiedLinkError|NoClassDefFoundError' || true
