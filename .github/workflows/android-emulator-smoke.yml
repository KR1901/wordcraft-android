name: Android Emulator Startup Smoke Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-emulator-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  emulator-smoke:
    name: Launch app on Android emulator
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
      - name: Run Android instrumentation smoke test
        id: smoke
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -no-audio -no-boot-anim
          disable-animations: true
          script: |
            chmod +x ./gradlew
            ./gradlew --no-daemon connectedDebugAndroidTest
      - name: Capture emulator logs on failure
        if: failure()
        shell: bash
        run: |
          adb devices
          adb logcat -d -v time -t 5000 | grep -E -C 5 'FATAL EXCEPTION|AndroidRuntime|com\.wordcraft\.android|Process: ' || true
