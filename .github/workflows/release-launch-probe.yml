name: Release APK launch probe

# Diagnostic workflow: installs the *release* APK (the artifact users install)
# and launches it on a real Android runtime, dumping any crash trace.
# Triggers on pushes to diag/** branches only, plus manual dispatch.

on:
  push:
    branches: ['diag/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    name: Launch release APK (API ${{ matrix.api }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        api: [30, 36]
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
      - name: Build release APK
        run: chmod +x ./gradlew && ./gradlew --no-daemon assembleRelease
      - name: Install and launch the release APK
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot
          emulator-boot-timeout: 1800
          disable-animations: true
          script: |
            set -x
            adb install -r app/build/outputs/apk/release/app-release.apk || echo "INSTALL_FAILED"
            adb logcat -c || true
            adb shell am start -W -n com.wordcraft.android/.MainActivity || echo "START_FAILED"
            sleep 20
            echo "=== process alive? ==="
            adb shell pidof com.wordcraft.android || echo "PROCESS_NOT_RUNNING"
            echo "=== resumed activity ==="
            adb shell dumpsys activity activities | grep -E "ResumedActivity|mResumedActivity" | head -5 || true
            echo "=== FATAL EXCEPTION ==="
            adb logcat -d -v time | grep -A 45 "FATAL EXCEPTION" || echo "NO_FATAL_EXCEPTION"
            echo "=== loader / class errors ==="
            adb logcat -d -v time | grep -E "UnsatisfiedLinkError|dlopen|cannot locate|NoClassDefFoundError|ClassNotFoundException|Resources\\\$NotFound|Unable to instantiate|android.os.BadParcelableException" | tail -80 || true
            echo "=== wordcraft logcat ==="
            adb logcat -d -v time | grep -i "wordcraft" | tail -120 || true
