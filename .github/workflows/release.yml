name: Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag (for example v0.1.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Build and publish APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.tag_name || github.ref }}
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
      - name: Build release APK
        run: chmod +x ./gradlew && ./gradlew --no-daemon clean testDebugUnitTest assembleRelease
      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release-unsigned.apk WordCraft-${GITHUB_REF_NAME}.apk
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.event.inputs.tag_name || github.ref_name }}"
          gh release create "$TAG" WordCraft-${GITHUB_REF_NAME}.apk \
            --title "WordCraft $TAG" \
            --notes "WordCraft Android APK build. This APK is unsigned and intended for testing. Configure signing secrets for signed distribution."
