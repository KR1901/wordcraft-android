name: Versioned Android Release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    name: Build versioned APK artifact
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
      - name: Read app version
        id: version
        shell: bash
        run: |
          VERSION_NAME=$(grep -E 'versionName' app/build.gradle.kts | head -n 1 | sed -E 's/.*"([^"]+)".*/\1/')
          test -n "$VERSION_NAME"
          echo "name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
      - name: Build and test release APK
        run: chmod +x ./gradlew && ./gradlew --no-daemon clean testDebugUnitTest assembleRelease
      - name: Upload versioned APK artifact
        uses: actions/upload-artifact@v6
        with:
          name: WordCraft-${{ steps.version.outputs.name }}-release
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 90
