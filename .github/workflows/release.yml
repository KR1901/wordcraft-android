name: Publish WordCraft APK Release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release.yml'
      - 'app/build.gradle.kts'
      - 'app/src/main/AndroidManifest.xml'

permissions:
  contents: write

jobs:
  release:
    name: Build and publish installable APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
      - name: Increment app version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION_NAME=$(grep -E 'versionName' app/build.gradle.kts | head -n 1 | sed -E 's/.*"([^"]+)".*/\1/')
          VERSION_CODE=$(grep -E 'versionCode' app/build.gradle.kts | head -n 1 | sed -E 's/.*= *([0-9]+).*/\1/')
          IFS=. read -r MAJOR MINOR PATCH <<< "$VERSION_NAME"
          PATCH=$((PATCH + 1))
          NEXT_VERSION="$MAJOR.$MINOR.$PATCH"
          NEXT_CODE=$((VERSION_CODE + 1))
          sed -i -E "s/versionCode = [0-9]+/versionCode = $NEXT_CODE/" app/build.gradle.kts
          sed -i -E "s/versionName = \"[^\"]+\"/versionName = \"$NEXT_VERSION\"/" app/build.gradle.kts
          echo "name=$NEXT_VERSION" >> "$GITHUB_OUTPUT"
          echo "code=$NEXT_CODE" >> "$GITHUB_OUTPUT"
      - name: Commit version bump to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/build.gradle.kts
          git commit -m "Bump WordCraft version to ${{ steps.version.outputs.name }}"
          git push origin HEAD:main
      - name: Build and test release APK
        run: chmod +x ./gradlew && ./gradlew --no-daemon clean testDebugUnitTest assembleRelease :probe:assembleRelease
      - name: Verify APK artifact
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          if unzip -l "$APK" | grep -q 'lib/arm64-v8a/'; then
            echo "APK includes arm64-v8a native libraries."
          else
            echo "APK has no arm64 native libraries."
          fi
          PROBE="probe/build/outputs/apk/release/probe-release.apk"
          test -s "$PROBE"
          echo "Probe APK size: $(stat -c%s "$PROBE") bytes"
      - name: Name APKs
        run: |
          cp app/build/outputs/apk/release/app-release.apk "WordCraft-${{ steps.version.outputs.name }}.apk"
          cp probe/build/outputs/apk/release/probe-release.apk "WordCraft-probe-${{ steps.version.outputs.name }}.apk"
      - name: Publish release with APK prominently listed
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.name }}"
          TAG="v$VERSION"
          git tag "$TAG" HEAD
          git push origin "refs/tags/$TAG"
          gh release create "$TAG" "WordCraft-$VERSION.apk" "WordCraft-probe-$VERSION.apk" --repo "$GITHUB_REPOSITORY" --title "WordCraft v$VERSION — Install APK" --notes "Install WordCraft v$VERSION on Android. Download WordCraft-$VERSION.apk below. Version code: ${{ steps.version.outputs.code }}. This release APK is debug-signed for direct testing; CI debug signing keys may change between builds, so uninstall an older build first if Android rejects an update. WordCraft-probe-$VERSION.apk is a ~30 KB dependency-free diagnostic app: if it opens, the device runs apps from this build stack and the problem is in the app's own dependencies. On-device Qwen inference is included in this build." --latest
