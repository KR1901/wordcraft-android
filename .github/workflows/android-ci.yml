name: Android CI and APK Release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, test, and publish installable APK
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
      - name: Build APKs and run unit tests
        run: chmod +x ./gradlew && ./gradlew --no-daemon clean testDebugUnitTest assembleDebug assembleRelease
      # Release APKs are preserved as GitHub Release assets. These Actions copies
      # are disposable build outputs; clear previous copies on main before uploads.
      - name: Prune previous build artifacts
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const artifacts = await github.paginate(
              github.rest.actions.listArtifactsForRepo,
              { owner, repo, per_page: 100 }
            );
            const isBuildArtifact = item =>
              item.name === "wordcraft-debug-apk" ||
              item.name === "wordcraft-test-reports" ||
              (item.name.startsWith("WordCraft-") && item.name.endsWith("-release"));
            for (const artifact of artifacts.filter(item => isBuildArtifact(item) && !item.expired)) {
              core.info(`Deleting old WordCraft build artifact ${artifact.id}: ${artifact.name} (${artifact.size_in_bytes} bytes)`);
              try {
                await github.rest.actions.deleteArtifact({
                  owner,
                  repo,
                  artifact_id: artifact.id,
                });
              } catch (error) {
                const status = error.status || error.response?.status;
                if (status === 404 || status === 410) continue;
                throw error;
              }
            }

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v6
        with:
          name: wordcraft-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 1
      - name: Read app version
        id: version
        shell: bash
        run: |
          VERSION_NAME=$(grep -E 'versionName' app/build.gradle.kts | head -n 1 | sed -E 's/.*"([^"]+)".*/\1/')
          test -n "$VERSION_NAME"
          echo "name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
      - name: Upload versioned release APK artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v6
        with:
          name: WordCraft-${{ steps.version.outputs.name }}-release
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 1
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: wordcraft-test-reports
          path: app/build/reports/tests/
          if-no-files-found: ignore
          retention-days: 3
