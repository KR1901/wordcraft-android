name: Android CI and APK Release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, test, and publish installable APK
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
      - name: Build APKs and run unit tests
        run: chmod +x ./gradlew && ./gradlew --no-daemon clean testDebugUnitTest assembleDebug assembleRelease
      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v6
        with:
          name: wordcraft-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
      - name: Read app version
        id: version
        shell: bash
        run: |
          VERSION_NAME=$(grep -E 'versionName' app/build.gradle.kts | head -n 1 | sed -E 's/.*"([^"]+)".*/\1/')
          test -n "$VERSION_NAME"
          echo "name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
      - name: Upload versioned release APK artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v6
        with:
          name: WordCraft-${{ steps.version.outputs.name }}-release
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 90
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: wordcraft-test-reports
          path: app/build/reports/tests/
          if-no-files-found: ignore
          retention-days: 7
