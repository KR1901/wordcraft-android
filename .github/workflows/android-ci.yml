name: Android CI and APK Release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, test, and publish installable APK
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
      - name: Build APKs and run unit tests
        run: chmod +x ./gradlew && ./gradlew --no-daemon clean testDebugUnitTest assembleDebug assembleRelease
      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v6
        with:
          name: wordcraft-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
      - name: Publish latest installable release APK
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          test -f "$APK"
          TAG="continuous"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f "$TAG" "$GITHUB_SHA"
          git push origin "refs/tags/$TAG" --force
          NOTES="Automatically updated installable APK from main commit $GITHUB_SHA. This is a release-variant APK signed with the CI debug key so it can be installed directly. CI signing keys may change between builds; uninstall an older build first if Android rejects an update."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber
            gh release edit "$TAG" --title "WordCraft — Latest APK" --notes "$NOTES" --prerelease
          else
            gh release create "$TAG" "$APK" --title "WordCraft — Latest APK" --notes "$NOTES" --prerelease
          fi
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: wordcraft-test-reports
          path: app/build/reports/tests/
          if-no-files-found: ignore
          retention-days: 7
